[package]
name = "r2x"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
rust-version = { workspace = true }
build = "build.rs"
description = "A framework plugin manager for the r2x power systems modeling ecosystem."
readme = { workspace = true }
keywords = ["power-systems", "r2x", "cli", "plugin-manager", "uv"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.wix]
upgrade-guid = "AB0643AB-0F2C-4FDC-ACFB-E7886B50614F"
path-guid = "B2C9C3FE-FD0C-4209-910C-A07D1A71C539"
license = false
eula = false

[features]
default = ["self-update"]
# Adds self-update functionality. Package-manager builds can disable this with
# `--no-default-features`.
self-update = ["dep:axoupdater", "dep:http", "dep:tokio"]

[dependencies]
atty = "0.2"
axoupdater = { version = "0.10.0", default-features = false, features = ["github_releases"], optional = true }
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde"] }
toml = { version = "0.9", features = ["preserve_order"] }
dirs = "6.0"
serde_yaml = "0.9"
regex = "1.10"
thiserror = "2.0"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.18"
which = "8.0.0"
walkdir = "2.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
http = { version = "1.1", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
r2x-manifest = { workspace = true }
r2x-ast = { workspace = true }
r2x-python = { workspace = true }
r2x-config = { workspace = true }
r2x-logger = { workspace = true }

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.0"
tempfile = "3.8"

[lints]
workspace = true
