name: "Setup uv & Python"
description: "Installs uv, sets up Python via uv, and configures PYO3_PYTHON environment variable"
inputs:
  python-version:
    description: 'Python version to install (e.g., "3.12")'
    required: true
    default: "3.12"
outputs:
  python-path:
    description: "Path to the uv-managed Python interpreter used for PyO3"
    value: ${{ steps.python.outputs.python-path }}
  resolved-version:
    description: "Full Python version reported by the selected interpreter"
    value: ${{ steps.python.outputs.resolved-version }}
  python-abi-version:
    description: "Major.minor Python ABI version used in libpython names"
    value: ${{ steps.python.outputs.python-abi-version }}
  python-prefix:
    description: "Prefix of the uv-managed Python installation"
    value: ${{ steps.python.outputs.python-prefix }}
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - name: Install Python via uv and set PYO3_PYTHON
      id: python
      shell: bash
      run: |
        REQUESTED_PYTHON_VERSION="${{ inputs.python-version }}"
        # shellcheck source=scripts/python_version.sh
        source "${GITHUB_WORKSPACE:-$PWD}/scripts/python_version.sh"
        if ! REQUESTED_PYTHON_ABI=$(r2x_python_abi_version "python-version" "$REQUESTED_PYTHON_VERSION" 2>&1); then
          echo "::error::$REQUESTED_PYTHON_ABI"
          exit 1
        fi
        INSTALL_HINT="uv python install $REQUESTED_PYTHON_VERSION"
        FIND_HINT="uv python find $REQUESTED_PYTHON_VERSION"
        if [ "$REQUESTED_PYTHON_ABI" != "$REQUESTED_PYTHON_VERSION" ]; then
          INSTALL_HINT="$INSTALL_HINT || uv python install $REQUESTED_PYTHON_ABI"
          FIND_HINT="$FIND_HINT || uv python find $REQUESTED_PYTHON_ABI"
        fi
        if ! uv python install "$REQUESTED_PYTHON_VERSION"; then
          if [ "$REQUESTED_PYTHON_ABI" != "$REQUESTED_PYTHON_VERSION" ]; then
            if ! uv python install "$REQUESTED_PYTHON_ABI"; then
              echo "::error::unable to install requested Python version $REQUESTED_PYTHON_VERSION (fallback ABI $REQUESTED_PYTHON_ABI also failed)"
              echo "::error::Install it with: $INSTALL_HINT"
              exit 1
            fi
          else
            echo "::error::unable to install requested Python version $REQUESTED_PYTHON_VERSION"
            echo "::error::Install it with: $INSTALL_HINT"
            exit 1
          fi
        fi
        UV_PYTHON_QUERY="$REQUESTED_PYTHON_VERSION"
        UV_PYTHON_BIN=$(uv python find "$UV_PYTHON_QUERY" 2>/dev/null || true)
        if [ -z "$UV_PYTHON_BIN" ] && [ "$REQUESTED_PYTHON_ABI" != "$REQUESTED_PYTHON_VERSION" ]; then
          UV_PYTHON_QUERY="$REQUESTED_PYTHON_ABI"
          UV_PYTHON_BIN=$(uv python find "$UV_PYTHON_QUERY" 2>/dev/null || true)
        fi
        if [ -z "$UV_PYTHON_BIN" ]; then
          echo "::error::unable to resolve Python for requested version $REQUESTED_PYTHON_VERSION (tried ABI $REQUESTED_PYTHON_ABI)"
          echo "::error::Install it with: $INSTALL_HINT"
          echo "::error::Verify with: $FIND_HINT"
          exit 1
        fi
        PYTHON_PREFIX=$(dirname "$(dirname "$UV_PYTHON_BIN")")
        PYTHON_VERSION=$("$UV_PYTHON_BIN" --version)
        PYTHON_ABI_VERSION=$("$UV_PYTHON_BIN" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
        if [ "$PYTHON_ABI_VERSION" != "$REQUESTED_PYTHON_ABI" ]; then
          echo "::error::python-version requested ABI $REQUESTED_PYTHON_ABI but uv resolved ABI $PYTHON_ABI_VERSION at $UV_PYTHON_BIN"
          exit 1
        fi
        UV_VERSION=$(uv --version)
        echo "PYO3_PYTHON=$UV_PYTHON_BIN" >> "$GITHUB_ENV"
        echo "R2X_PYTHON_VERSION=$REQUESTED_PYTHON_VERSION" >> "$GITHUB_ENV"
        echo "python-path=$UV_PYTHON_BIN" >> "$GITHUB_OUTPUT"
        echo "resolved-version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
        echo "python-abi-version=$PYTHON_ABI_VERSION" >> "$GITHUB_OUTPUT"
        echo "python-prefix=$PYTHON_PREFIX" >> "$GITHUB_OUTPUT"
        echo "Setting PYO3_PYTHON => $UV_PYTHON_BIN ($PYTHON_VERSION)"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### Python runtime"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Requested | \`$REQUESTED_PYTHON_VERSION\` |"
            echo "| Requested ABI | \`$REQUESTED_PYTHON_ABI\` |"
            echo "| Resolved query | \`$UV_PYTHON_QUERY\` |"
            echo "| Resolved | \`$PYTHON_VERSION\` |"
            echo "| ABI | \`$PYTHON_ABI_VERSION\` |"
            echo "| Interpreter | \`$UV_PYTHON_BIN\` |"
            echo "| Prefix | \`$PYTHON_PREFIX\` |"
            echo "| uv | \`$UV_VERSION\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Fix libpython install name for portable builds
      if: runner.os == 'macOS'
      shell: bash
      run: |
        PYTHON_PREFIX="${{ steps.python.outputs.python-prefix }}"
        PYTHON_ABI_VERSION="${{ steps.python.outputs.python-abi-version }}"
        LIBPYTHON="$PYTHON_PREFIX/lib/libpython${PYTHON_ABI_VERSION}.dylib"
        if [ -f "$LIBPYTHON" ]; then
          echo "Fixing libpython install name for portable binary linking"
          echo "  Before: $(otool -D "$LIBPYTHON" | tail -1)"
          install_name_tool -id "@rpath/libpython${PYTHON_ABI_VERSION}.dylib" "$LIBPYTHON"
          echo "  After:  $(otool -D "$LIBPYTHON" | tail -1)"
        else
          echo "libpython not found at $LIBPYTHON (skipping install name fix)"
        fi
